patch:
  style:
    color_scheme: jwu
    color_scheme_dark: jwu
    candidate_list_layout: linear
    text_orientation: horizontal

  preset_color_schemes/jwu:
    name: jwu                                # based on "Apathy"
    author: Johnny Wu
    candidate_list_layout: linear            # horizontal
    inline_preedit: true                     # single line; false = two lines
    candidate_format: "%c\u2005%@\u2005"     # spaces around index %c and candidate %@
    corner_radius: 5                         # candidate panel corner radius
    border_height: 0
    border_width: 0
    font_face: "PingFangSC-Regular"          # candidate font
    font_point: 16                           # candidate font size
    label_font_face: "Helvetica"             # index font
    label_font_point: 12                     # index font size
    comment_font_face: "Helvetica"           # comment font
    comment_font_point: 16                   # comment font size
    back_color: 0xFFFFFF                     # panel background
    text_color: 0x424242                     # highlighted candidate text
    hilited_candidate_text_color: 0xEE6E00   # candidate text
    hilited_candidate_back_color: 0xFFF0E4   # candidate background
    comment_text_color: 0x999999             # pinyin hint text
