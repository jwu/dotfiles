patch:
  # Key-binding patches only: the base config comes from the default.yaml that
  # fcitx5/install-linux.sh unpacks on first run. See docs/rime/rime-config.md.
  #
  # Append list items with the `path/+` form. Do not wrap them in `__patch`: that
  # patches the node it sits in instead of the target, replacing rime-ice's whole
  # key_binder/bindings list. See docs/rime/rime-config.md.
  key_binder/bindings/+:
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: paging, accept: equal, send: Page_Down }
    - { when: has_menu, accept: minus, send: minus }
    - { when: paging, accept: minus, send: Page_Up }

  # Caps Lock turns on the system caps LED and switches Rime to ascii_mode in one
  # step, so the capitals go straight to the application. commit_code commits the
  # raw pinyin first when a composition is in progress.
  ascii_composer/switch_key/Caps_Lock: commit_code

  # One switcher hotkey only (rime-ice ships F4 / Control+grave /
  # Control+Shift+grave).
  switcher/hotkeys:
    - Control+Shift+grave
