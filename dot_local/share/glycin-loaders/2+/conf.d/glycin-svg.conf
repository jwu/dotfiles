# glycin-svg crashes in its fontconfig thread (SIGSEGV in FcRuleDestroy while
# parsing /etc/fonts) when the loader is sandboxed. Icons are drawn with paths,
# not text, so the loader does not need fontconfig at all.
[loader:image/svg+xml]
Exec=/usr/lib/glycin-loaders/2+/glycin-svg
Identifiers=ext:svg;
ExposeBaseDir=true
Fontconfig=false

[loader:image/svg+xml-compressed]
Exec=/usr/lib/glycin-loaders/2+/glycin-svg
Identifiers=ext:svgz;
Extension=svgz
ExposeBaseDir=true
Fontconfig=false
