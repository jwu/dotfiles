; Baseline for a fresh install only: chezmoi creates this file once and Total
; Commander owns it afterwards. Only entries that differ from TC's defaults are
; here, plus the three sections that were customised by hand.
; See docs/totalcmd/totalcmd-config.md.
[Configuration]
UseRightButton=0
RenameSelOnlyName=1
AltSearch=3
UseRubberBandSelection=0
EverythingForSize=0

[Shortcuts]
A+D=cm_EditPath
F2=cm_RenameOnly

[Colors]
BackColor=-1
BackColor2=-1
ForeColor=-1
MarkColor=16744448
CursorColor=12632256
CursorText=-1
InverseCursor=0
ThemedCursor=0
InverseSelection=1

[AllResolutions]
FontSize=9
FontName=Segoe UI
FontCharset=1
FontSizeWindow=9
FontNameWindow=Segoe UI
FontCharsetWindow=1
FontWeight=400
FontWeightWindow=400
FontNameDialog=Microsoft Sans Serif
FontCharsetDialog=1
