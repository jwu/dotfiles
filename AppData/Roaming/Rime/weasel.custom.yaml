patch:
  style/+:
    color_scheme: jwu
    color_scheme_dark: jwu
    font_point: 12
    label_font_point: 10
    comment_font_point: 10
    horizontal: true
    inline_preedit: true
    label_format: "%s"
    layout:
      align_type: bottom
      shadow_radius: 4                       # 0 = no shadow; needs an opaque colour in the scheme
      shadow_offset_x: 1                     # shadow X offset
      shadow_offset_y: 1                     # shadow Y offset
      corner_radius: 4
      round_corner: 4                        # candidate block radius (hilited_corner_radius)
      border_width: 1
      margin_x: 0                            # negative hides the panel
      margin_y: 0                            # negative hides the panel
      hilite_spacing: 4                      # gap between candidate and index
      hilite_padding: 4                      # padding inside the highlight

  preset_color_schemes/jwu:
    name: jwu
    author: Johnny Wu
    back_color: 0xFFFFFF
    text_color: 0x424242
    hilited_candidate_text_color: 0xEE6E00
    hilited_candidate_back_color: 0xFFF0E4
    comment_text_color: 0x999999
    shadow_color: 0x33000000
    border_color: 0x8E8E8E
    # candidate_border_color: 0x000000
    hilited_candidate_border_color: 0x8E8E8E
