<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  FreeType load params + CJK fallback; see docs/fontconfig.md.

  This file is loaded automatically through /etc/fonts/fonts.conf's xdg include,
  so it must not include the system config back.
-->
<fontconfig>
  <!--
    hintslight is FT_LOAD_TARGET_LIGHT, which is what Ghostty asks for through
    its own `light` freetype-load-flags. Ghostty never reads fontconfig, so this
    is the only half of it we can meet; everything else here reads this file.
  -->
  <match target="pattern">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>

  <!--
    Family-name redirects only: lang=zh rules never reach Chrome's fallback path.
    JP/KR/TC variants stay untouched on purpose.
  -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Gothic SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans Mono CJK SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Mono SC</string></edit>
  </match>

  <!--
    Generic families: pull the Simplified CJK faces up beside their Latin
    counterparts. Ranked on its own, fontconfig puts "Noto Sans CJK KR" (and the
    mono / serif equivalents) ahead of the SC face, so generic requests render
    Chinese with Korean glyph variants. Latin is named first on purpose: <prefer>
    prepends, and fontconfig merges the list ahead of the existing chain, so
    naming only the CJK face would push Sarasa ahead of Noto Sans Mono instead.

    These must stay after the redirects above, at the end of the file. Loaded
    from conf.d they run first, the redirects then rewrite "Noto Sans CJK SC"
    into Sarasa Gothic SC in place, and the hoisted position sends every generic
    monospace request to Sarasa - Latin included. Measurements: docs/fontconfig.md.
  -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>Noto Sans Mono CJK SC</family></prefer>
  </alias>
</fontconfig>
