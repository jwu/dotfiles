<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  FreeType load params + CJK fallback; see docs/fontconfig.md.

  This file is loaded automatically through /etc/fonts/fonts.conf's xdg include,
  so it must not include the system config back.
-->
<fontconfig>
  <match target="pattern">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>

  <!--
    Family-name redirects only: lang=zh rules never reach Chrome's fallback path.
    JP/KR/TC variants stay untouched on purpose.
  -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Gothic SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans Mono CJK SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Mono SC</string></edit>
  </match>
</fontconfig>
