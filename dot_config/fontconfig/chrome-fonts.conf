<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Chrome-only fontconfig, pointed at by FONTCONFIG_FILE from
  ~/.local/bin/google-chrome-stable, so it has to include the system config back.
  Nothing else reads it: 50-user.conf loads only fontconfig/conf.d and
  fontconfig/fonts.conf.

  Web font stacks name no installed face on this machine, so Chrome stopped at
  Liberation Mono / Liberation Sans - Courier and Helvetica metric clones. These
  aliases pick the faces instead.

  Weight: monospace steps up to Medium/SemiBold so code blocks match zed and
  ghostty exactly. Proportional body text stays at the requested Regular, where
  CJK outweighing Latin is what makes mixed lines look uneven.
  Measurements and rejected variants: docs/fontconfig.md.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Monospace stacks, e.g. ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas. -->
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SFMono-Regular</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SF Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Menlo</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Monaco</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Consolas</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Courier New</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Courier</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Andale Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Liberation Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Noto Sans Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>DejaVu Sans Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Roboto Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>JetBrains Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Fira Code</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Fira Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Cascadia Code</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Source Code Pro</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Ubuntu Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Hack</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>IBM Plex Mono</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Inconsolata</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>FiraMono Nerd Font</family></prefer>
  </alias>

  <!-- Sans stacks. system-ui resolves through Arial on Linux, so Arial has to be listed. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Liberation Sans</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Roboto</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Inter</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Noto Sans</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Open Sans</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Verdana</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Tahoma</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>DejaVu Sans</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SF Pro Text</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>-apple-system</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>BlinkMacSystemFont</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>

  <!--
    Monospace only: match zed / ghostty exactly. FiraMono has a real Medium; Sarasa
    does not, so its CJK steps to SemiBold there too - the same choice zed makes
    via font-codepoint-map.
  -->
  <match target="pattern">
    <test name="family" compare="eq"><string>FiraMono Nerd Font</string></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <!-- Chrome's Fixed-width pref names this family; code-block CJK lands here. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Mono SC SemiBold</string></edit>
  </match>

  <!--
    Align hinting with Ghostty. Ghostty never asks fontconfig: it drives FreeType
    straight from its own `freetype-load-flags`, whose Linux default ends in
    `light`, i.e. FT_LOAD_TARGET_LIGHT. That is exactly what Skia maps
    hintstyle=hintslight to, so this one line makes both renderers agree. The
    global config asks for hintfull (sharper, grid-fitted); this overrides it for
    Chrome only. Skia's `autohint` attribute is a Windows/macOS thing and is not
    consulted here, so nothing else needs pinning.
  -->
  <match target="pattern">
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
