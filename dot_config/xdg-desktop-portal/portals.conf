# Which xdg-desktop-portal backends this session uses.
#
# niri ships no portal backend of its own, and xdg-desktop-portal-wlr's UseIn list
# predates niri, so the Screenshot interface falls back to the GTK backend, which
# shells out to gnome-screenshot (not installed here). Point just that interface at
# wlr: it shells out to grim, which captures through wlr-screencopy, and flameshot
# needs a full-screen image to draw its own overlay on. Everything else keeps the
# default backend.

[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
