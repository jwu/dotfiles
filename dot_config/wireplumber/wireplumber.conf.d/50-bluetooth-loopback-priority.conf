# A Bluetooth device playing A2DP has no real microphone, but WirePlumber
# still creates a silent loopback "bluez_input" source for it with a hardcoded
# priority.session of 2010 -- just above the built-in mic's 2009. It then wins
# the default-source election, and voxtype, which follows the default source,
# recorded pure silence while the K13 speaker was connected.
#
# Lift the built-in mic above that. bluetooth.autoswitch-to-headset-profile
# stays enabled on purpose: a Bluetooth device that genuinely enters HFP still
# exposes a real capture source and gets picked over the built-in mic when an
# app asks for it explicitly. See docs/voxtype.md.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.pci.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2200
      }
    }
  }
]
