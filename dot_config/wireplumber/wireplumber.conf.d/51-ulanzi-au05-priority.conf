# Default-source priority when the AU05 is connected. It is a hand-held
# microphone, so it should win over the built-in one while it is plugged in;
# unplugging it falls back to the built-in mic (2200, next file) and then to
# Bluetooth's loopback (2010). voxtype follows the default source, so this puts
# the AU05's own mic behind its F9 key without pinning a device name that
# carries a per-unit serial. See docs/ulanzi-au05.md.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-AU05.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2300
      }
    }
  }
]
