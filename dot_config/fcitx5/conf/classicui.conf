# Vertical Candidate List
Vertical Candidate List=False
# Use mouse wheel to go to prev or next page
WheelForPaging=True
# Font. SemiBold because Sarasa has no Medium, and Ghostty pins its CJK to
# SemiBold too; see docs/fontconfig.md.
Font=Sarasa Mono SC SemiBold 12
# Menu Font
MenuFont=Sarasa Mono SC SemiBold 12
# Tray Font
TrayFont=Sarasa Mono SC Bold 12
# Theme
Theme=jwu
# Dark Theme
DarkTheme=jwu
# Follow system light/dark color scheme
UseDarkTheme=False
# Follow system accent color if it is supported by theme and desktop
UseAccentColor=False
